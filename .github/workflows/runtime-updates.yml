# Track the four agent runtimes, then build, test and publish TaskSolver.
#
# Runs twice a day, on pushes to main that change code (docs, Nix and CI files excluded), and on
# demand. `tools/runtimes.py check` compares the pins (antigravity/vendor.json, codex/vendor.json,
# claude/vendor.json, kimi/vendor.json) with the latest releases of every separately released
# part: agy, Codex (CLI and Python SDK in one tag), the Claude Agent SDK and the Claude Code CLI
# (tracked independently), and Kimi Code (CLI and node SDK in one tag). Each run picks one mode:
#
#   prerelease  a runtime is outdated: `tools/runtimes.py adopt` replays TaskSolver's patches onto
#               the new release; build, offline tests, patch bump, the redistributable conda bundle
#               (no agy or Claude Code), tag, push and a GitHub pre-release of the latest code.
#   release     a manual run with `release` checked: the same, published as a full release.
#   validate    a push with nothing to adopt: build and offline tests only.
#   none        a scheduled or manual run with nothing to adopt.
#
# Runtimes adopt independently. One whose adoption fails (a patch conflict upstream moved more
# than its hooks, a failed agy conversion) is shelved onto `runtime-updates/run-<id>-<runtime>` with
# an issue, and the run goes on with the others; a temporary failure (the network, an upstream
# service: exit 75) is skipped until the next run. A build or test failure hands the remaining
# adoptions over together on `runtime-updates/run-<id>`. While an issue is open, scheduled and
# push runs hold its runtimes at the versions it names and still adopt the others; a newer upstream
# release of a held runtime is tried again. Runs queue one at a time, and each builds main as it is
# when it starts and adopts what is outdated there: the run ahead may have released since it was
# queued. When main gains code during a build, the release is not pushed (it was not tested on
# that code); that push's run adopts on it. A failure of the adoption step itself (the script,
# not an adoption) holds nothing, so each scheduled run repeats it until the script is fixed.
# The commits and tags this workflow pushes with GITHUB_TOKEN start no new runs. It keeps
# nix/hashes.json current but does not build the Nix package: the downstream Nix configuration
# that pins TaskSolver builds and tests it.
#
# Repository variables: RUNTIME_RUNNER (JSON runs-on value, default "ubuntu-24.04"; a self-hosted
# runner keeps the build caches) and PREFIX_CHANNEL (prefix.dev channel for full releases, using
# trusted publishing; unset skips the upload).
name: Runtime updates

on:
  schedule:
    - cron: "17 4,16 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
      - .gitattributes
      - ".github/**"
      - ".agents/**"
      - ".claude/**"
      - ".vscode/**"
      - "**.nix"
      - flake.lock
      - "nix/**"
  workflow_dispatch:
    inputs:
      runtimes:
        description: Runtimes to check and adopt, space-separated (empty means all four)
        type: string
        default: ""
      release:
        description: Publish a full release (after adopting any outdated runtimes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime-updates
  cancel-in-progress: false

defaults:
  run:
    # With pipefail, which GitHub's default shell lacks: `check | tee` fails when the check does.
    shell: bash

env:
  PIXI_VERSION: v0.83.0
  # Everything an adoption or a release may change; anything else staged stops the release.
  RELEASE_PATHS: >-
    pyproject.toml README.md antigravity/vendor.json codex/vendor.json claude/vendor.json
    kimi/vendor.json codex/vendor claude/vendor/sdk kimi/vendor/kimi-code codex/pycodex/sdk.py
    nix/hashes.json
  # github:Wenri/patchnar 0.22.0, whose bun_graph unbundles Claude Code: --extract, --clean (the
  # runtime without its payload, either of Bun's layouts) and --natives (the private Bun entry
  # points the split runtime calls).
  PATCHNAR_REF: 3fba16bc5313e0d37aa37ea340e3cdd996dbae99

jobs:
  check:
    name: Check upstream releases
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      runtimes: ${{ steps.check.outputs.runtimes }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The tip: a queued run's triggering commit is stale once the run ahead has released.
          ref: ${{ github.ref }}
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.runtimes }}
          FULL_RELEASE: ${{ inputs.release }}
        run: |
          held=()
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            # Open hand-work issues hold their runtimes at the versions they name.
            gh issue list --state open --limit 200 --json title --jq '.[].title' > "$RUNNER_TEMP/issues.txt"
            held=(--held "$RUNNER_TEMP/issues.txt")
          fi
          status=0
          # shellcheck disable=SC2086  # REQUESTED is a space-separated list
          python3 tools/runtimes.py check $REQUESTED --github-output "$RUNNER_TEMP/check.out" "${held[@]}" 2>&1 |
            tee "$RUNNER_TEMP/check.log" || status=$?
          sed -n 's/^held: /::notice::Held /p' "$RUNNER_TEMP/check.log"
          runtimes=$(sed -n 's/^runtimes=//p' "$RUNNER_TEMP/check.out" 2> /dev/null || true)
          targets=$(sed -n 's/^targets=//p' "$RUNNER_TEMP/check.out" 2> /dev/null || true)
          if [ "$status" = 75 ]; then
            # An upstream service or the network: nothing to adopt now; a push still validates.
            echo "::warning::Checking upstream failed temporarily; the next run retries"
            runtimes="" targets=""
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
          if [ "$FULL_RELEASE" = true ]; then mode=release
          elif [ -n "$runtimes" ]; then mode=prerelease
          elif [ "$GITHUB_EVENT_NAME" = push ]; then mode=validate
          else mode=none
          fi
          echo "::notice::Mode $mode${targets:+, adopting $targets}"
          { echo "runtimes=$runtimes"; echo "mode=$mode"; } >> "$GITHUB_OUTPUT"

  release:
    name: Adopt, build and publish
    needs: check
    # main only: dispatched on another branch, the release would push that branch to main.
    if: needs.check.outputs.mode != 'none' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.RUNTIME_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
      id-token: write
    env:
      RUNTIMES: ${{ needs.check.outputs.runtimes }}
      MODE: ${{ needs.check.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Make room on the hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker system prune --all --force > /dev/null || true
          sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work
          # rustc reaches 8 GB on codex's largest crates; swap keeps 16 GB runners from OOM-killing it.
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile > /dev/null && sudo swapon /mnt/swapfile
          free -g
          { echo "PIXI_CACHE_DIR=/mnt/work/pixi-cache"; echo "RATTLER_CACHE_DIR=/mnt/work/rattler-cache"; } >> "$GITHUB_ENV"
          df -h / /mnt

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Put the large build trees on the scratch disk
        if: runner.environment == 'github-hosted'
        run: |
          mkdir -p /mnt/work/pixi /mnt/work/codex-target
          ln -s /mnt/work/pixi .pixi
          ln -s /mnt/work/codex-target codex/vendor/codex-rs/target
          # .gitignore's `.pixi/` and `/target/` match directories only, not these symlinks.
          printf '/.pixi\n/codex/vendor/codex-rs/target\n' >> .git/info/exclude

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: cachix/install-nix-action@v31.11.3

      - name: Build bun_graph (unbundles Claude Code)
        run: |
          nix build "github:Wenri/patchnar/$PATCHNAR_REF" --out-link "$RUNNER_TEMP/patchnar"
          echo "$RUNNER_TEMP/patchnar/bin" >> "$GITHUB_PATH"

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          run-install: false

      - name: Adopt upstream releases
        id: adopt
        run: |
          if [ -n "$RUNTIMES" ]; then
            # main or upstream may have moved since the check job, whose outputs a re-run of this
            # job keeps: adopt what is outdated in this checkout.
            # shellcheck disable=SC2086  # a space-separated list
            python3 tools/runtimes.py check $RUNTIMES --github-output "$RUNNER_TEMP/check.out"
            RUNTIMES=$(sed -n 's/^runtimes=//p' "$RUNNER_TEMP/check.out")
            TARGETS=$(sed -n 's/^targets=//p' "$RUNNER_TEMP/check.out")
          fi
          adopted=()
          for runtime in $RUNTIMES; do
            status=0
            python3 tools/runtimes.py adopt "$runtime" > "$RUNNER_TEMP/adopt-$runtime.log" 2>&1 || status=$?
            tee -a "$RUNNER_TEMP/adopt.log" < "$RUNNER_TEMP/adopt-$runtime.log"
            if [ "$status" = 0 ]; then adopted+=("$runtime"); continue; fi
            targets=$(python3 tools/runtimes.py targets "$TARGETS" "$runtime")
            if [ "$status" = 75 ]; then
              echo "::warning::Adopting $targets failed temporarily; the next run retries it"
              python3 tools/runtimes.py shelve "$runtime" --discard
              continue
            fi
            # This runtime needs hand work on its own branch; the others go on.
            branch="runtime-updates/run-$GITHUB_RUN_ID-$runtime"
            commit=$(python3 tools/runtimes.py shelve "$runtime" --message "Adopt $targets (needs hand work, run $GITHUB_RUN_ID)")
            tools/hand_over.sh "$commit" "$branch" "$targets" "$RUNNER_TEMP/adopt-$runtime.log"
            echo "::error::Adopting $targets needs hand work: branch $branch"
          done
          git status --short | tee -a "$RUNNER_TEMP/adopt.log"
          # What the rest of the run releases: the adopted subset (the later steps read these outputs).
          runtimes="${adopted[*]}"
          mode=$MODE
          if [ -z "$runtimes" ] && [ "$MODE" = prerelease ]; then
            echo "::notice::No runtime adopted; building and testing main as it is"
            mode=validate
          fi
          # shellcheck disable=SC2086  # a space-separated list
          { echo "runtimes=$runtimes"; echo "targets=$(python3 tools/runtimes.py targets "$TARGETS" $runtimes)"
            echo "mode=$mode"; } >> "$GITHUB_OUTPUT"

      - name: Build the workspace (agy, Codex, Claude Code and Kimi Code)
        run: pixi install --locked 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Refresh the Nix hashes
        if: steps.adopt.outputs.mode != 'validate' && hashFiles('nix/update-hashes') != ''
        run: |
          # After the build, which completes codex's Cargo.lock. A refresh refetches about 3.3 GB
          # (the Codex crates with the rusty_v8 checkout, the Kimi pnpm store), so it runs only when
          # an input of nix/hashes.json changed since the commit that last wrote it.
          base=$(git log -1 --format=%H -- nix/hashes.json)
          if [ -z "$base" ] || ! git diff --quiet "$base" -- codex/vendor/codex-rs/Cargo.lock \
               kimi/vendor/kimi-code/pnpm-lock.yaml ':(glob)kimi/vendor/kimi-code/**/package.json' \
               claude/vendor.json package.nix flake.lock nix/update-hashes; then
            nix/update-hashes 2>&1 | tee "$RUNNER_TEMP/nix-hashes.log"
          fi

      - name: Offline tests
        timeout-minutes: 30   # a hang fails here; the job's own timeout would hand nothing over
        run: |
          # Every suite runs. tests.log holds the running suite, then the end of each failed one.
          failed=()
          suite() {   # suite NAME COMMAND...
            echo "::group::$1"
            if ! "${@:2}" 2>&1 | tee "$RUNNER_TEMP/tests.log"; then
              failed+=("$1")
              { echo "FAILED: $1"; tail -n 30 "$RUNNER_TEMP/tests.log"; } >> "$RUNNER_TEMP/failed"
            fi
            echo "::endgroup::"
          }
          suite typecheck pixi run typecheck
          for test in \
              test_runtimes test_reconstruct test_claude_sdk test_claude_bundle test_claude_unbundle \
              test_claude_transport test_codex_sdk test_codex_sdk_native test_chat_mode test_codex_argv \
              test_codex_process test_responses_decode test_kimi_argv test_kimi_decode test_kimi_process \
              test_kimi_session test_kimi_bundle test_kimi_capture test_wire_session test_wire_process \
              test_wire_bridge test_wirecap_framing test_mcp_serializers test_terminal test_tasksolver_terminal \
              test_webterm test_webterm_views test_webpage test_agy_symbols test_agy_stubs test_appresponse test_config \
              test_system_messages test_agy_system_message_queue test_agy_system_message_api \
              test_claude_native; do
            suite "$test" pixi run python "test_scripts/$test.py"
          done
          # The native UI and bridge checks prove that a Claude release's source contracts still
          # hold at run time, against a loopback model.
          suite test_claude_native_bridge pixi run node --test test_scripts/test_claude_native_bridge.mjs
          if [ "${#failed[@]}" -gt 0 ]; then
            mv "$RUNNER_TEMP/failed" "$RUNNER_TEMP/tests.log"
            echo "::error::Failed: ${failed[*]}"
            exit 1
          fi

      - name: Raise the version
        id: version
        if: steps.adopt.outputs.mode != 'validate'
        run: |
          python3 tools/runtimes.py bump 2>&1 | tee "$RUNNER_TEMP/bump.log"
          echo "version=$(tail -n 1 "$RUNNER_TEMP/bump.log")" >> "$GITHUB_OUTPUT"

      - name: Build the redistributable bundle
        if: steps.adopt.outputs.mode != 'validate'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # After the bump, so the package carries the version it is released under.
          pixi publish --target-dir dist 2>&1 | tee "$RUNNER_TEMP/publish.log"
          pixi run python tools/check_bundle.py dist/tasksolver-"$VERSION"-*.conda 2>&1 |
            tee -a "$RUNNER_TEMP/publish.log"

      - name: Commit, tag and push
        id: publish
        if: steps.adopt.outputs.mode != 'validate'
        env:
          version: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.adopt.outputs.mode }}
          RUNTIMES: ${{ steps.adopt.outputs.runtimes }}
          TARGETS: ${{ steps.adopt.outputs.targets }}
        run: |
          exec > >(tee "$RUNNER_TEMP/push.log") 2>&1
          # shellcheck disable=SC2086  # RUNTIMES is a space-separated list
          python3 tools/runtimes.py notes $RUNTIMES > "$RUNNER_TEMP/notes.md"
          git add -A
          unexpected=$(git diff --cached --name-only | while read -r path; do
            for allowed in $RELEASE_PATHS; do
              if [ "$path" = "$allowed" ] || [ "${path#"$allowed"/}" != "$path" ]; then continue 2; fi
            done
            echo "$path"
          done)
          if [ -n "$unexpected" ]; then
            echo "::error::Files outside RELEASE_PATHS are staged; ignore them or extend RELEASE_PATHS:"
            echo "$unexpected"
            exit 1
          fi
          if [ "$MODE" = prerelease ]; then
            git commit -m "Pre-release $version: adopt $TARGETS"
          else
            git commit -m "Release $version${TARGETS:+: adopt $TARGETS}"
          fi
          git tag -a "v$version" -m "TaskSolver $version"
          if ! git push --atomic origin HEAD:main "v$version"; then
            # main moved during the build. Docs, Nix and CI commits (the push trigger's
            # paths-ignore) don't change what was tested, so rebase onto those and retry. Code
            # fails the release: that push's run adopts on it.
            git fetch origin main
            moved=$(git diff --name-only HEAD~1 origin/main | while read -r path; do
              case "$path" in
                *.md|LICENSE|.gitignore|.gitattributes|.github/*|.agents/*|.claude/*|.vscode/*|*.nix|flake.lock|nix/*) ;;
                *) echo "$path" ;;
              esac
            done)
            if [ -n "$moved" ]; then
              echo "::error::main gained code changes during the build; not releasing untested code:"
              echo "$moved"
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            git rebase origin/main
            git tag -f -a "v$version" -m "TaskSolver $version"
            git push --atomic origin HEAD:main "v$version"
          fi

      - name: Create the GitHub release
        if: steps.adopt.outputs.mode != 'validate'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.adopt.outputs.mode }}
        run: |
          prerelease=()
          if [ "$MODE" = prerelease ]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" dist/tasksolver-"$VERSION"-*.conda --verify-tag --title "TaskSolver $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${prerelease[@]}"

      - name: Upload to prefix.dev
        if: steps.adopt.outputs.mode == 'release' && vars.PREFIX_CHANNEL != ''
        env:
          CHANNEL: ${{ vars.PREFIX_CHANNEL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: pixi upload prefix --channel "$CHANNEL" --generate-attestation dist/tasksolver-"$VERSION"-*.conda

      - name: Hand a failed build or test over
        if: failure() && steps.adopt.outputs.runtimes != '' && steps.publish.conclusion != 'success' && steps.publish.outputs.superseded != 'true'
        env:
          TARGETS: ${{ steps.adopt.outputs.targets }}
        run: |
          branch="runtime-updates/run-$GITHUB_RUN_ID"
          git reset -q
          for path in $RELEASE_PATHS; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" > /dev/null 2>&1; then
              git add -A -- "$path"
            fi
          done
          git commit -qm "Adopt $TARGETS (needs hand work, run $GITHUB_RUN_ID)" || true
          # The newest log is the failed step's: each step from the build to the push writes one.
          log=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.log' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          tools/hand_over.sh HEAD "$branch" "$TARGETS" "${log:-/dev/null}"
