[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tasksolver"
version = "0.0.1"
description = "Provider-agnostic VLM query flow with API, Claude Agent SDK, Codex SDK, instrumented CLI, and local HuggingFace backends."
readme = "README.md"
requires-python = ">=3.10"
# Core deps are the ones imported unconditionally (Agent + common/event/keychain)
# plus API clients and runtime dependencies for the SDK sources bundled here.
# The consuming environment owns resolution within these compatibility bounds.
dependencies = [
    "loguru",
    "pillow",
    "numpy",
    "requests",
    "tqdm",
    "shortuuid",
    "pymongo",            # provides the `bson` module (standalone `bson` breaks on Python 3.14)
    "openai",             # gpt4v + vLLM adapters
    "anthropic",          # claude + kimi adapters
    # Runtime dependencies of the checked-in Claude Agent SDK (claude/vendor/sdk).
    "anyio>=4", "sniffio>=1", "mcp>=1.23,<3", "jsonschema>=4.20",
    "typing-extensions>=4; python_version<'3.11'",
    "pydantic>=2.12", "packaging>=26.2", # official Codex Python SDK bundled from the pinned vendor tree
    "google-generativeai", # gemini adapter
    "pygit2",             # wirecap/runtime/workspace.py: scratch git workspace pyagy/pycodex run in
    "lief",               # make_libagy.py: a source build converts the pinned agy into libagy.so
]

[project.optional-dependencies]
# These extras are plain PEP 621 metadata so the package stays installable as a
# dependency by uv and pixi. The torch wheel index, no-build-isolation, and the
# CUDA requirement are deliberately NOT encoded here — that config does not
# propagate to a consumer, so a consuming project must point at a torch index
# itself. TaskSolver's own pixi dev env wires all of that up under [tool.pixi.*].

# Local HuggingFace model adapters (qwen / intern / minicpm / phi / llama),
# imported lazily only when those model ids are selected. flash-attn is included
# here because the intern/phi/minicpm/llama adapters hardcode `flash_attention_2`
# (only qwen runs without it); it builds from source and needs CUDA — the pixi
# `local` feature below supplies the torch index, no-build-isolation, and toolchain.
local = [
    "torch",
    "torchvision",
    "torchaudio",
    "transformers",
    "accelerate",
    "timm",
    "bitsandbytes",
    "decord",
    "qwen-vl-utils",
    "einops",
    "flash-attn",
]

# Legacy BlenderAlchemy app / UI / plotting stack. Not imported by the tasksolver
# library itself; restored from the original setup.py install_requires.
app = [
    "streamlit",
    "flask",
    "flask-cors",
    "matplotlib",
]

# Package roots: tasksolver + the shared `wirecap` (capture/decode/native bridge, reused by
# all wrappers) at the repo root; the antigravity `pyagy` package under antigravity/; the
# codex `pycodex` package under codex/; the kimi-code `pykimi` package under kimi/;
# pyclaude plus both official SDK source packages under their vendor roots. List all
# roots so they ship in the (editable) package instead of relying on the PYTHONPATH activation.
# The nested shim-runtime subpackages (pyagy.agy_process, pycodex.codex_process,
# pykimi.kimi_process, wirecap.decode/runtime) are found automatically; the test/experiment
# scripts live in test_scripts/, not the package.
[tool.setuptools.packages.find]
where = [".", "antigravity", "codex", "kimi", "claude", "codex/vendor/sdk/python/src", "claude/vendor/sdk/src"]
include = ["tasksolver*", "wirecap*", "pyagy*", "pycodex*", "pykimi*", "pyclaude*", "openai_codex*", "claude_agent_sdk*"]

[tool.setuptools]
license-files = ["LICENSE", "codex/vendor/LICENSE", "codex/vendor/NOTICE", "claude/vendor/sdk/LICENSE"]

[tool.setuptools.package-data]
openai_codex = ["py.typed"]
claude_agent_sdk = ["py.typed", "_bundled/claude"]

# --- pixi workspace + buildable package -----------------------------------
# Uses the `pixi-build` preview feature: rather than installing this project as
# an editable PyPI dependency, pixi builds it as a conda package via the
# pixi-build-python backend, and the workspace depends on it by path. The
# package's runtime deps are read from [project.dependencies] above. The heavy
# `local` extra stays out of the DEFAULT environment (its ML stack may lag new Python
# releases, and it needs an NVIDIA driver for CUDA 13.4); it has its own `cuda` environment — see
# [tool.pixi.environments] at the bottom.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "13.4" }]
preview = ["pixi-build"]

[tool.pixi.dependencies]
python = "3.15.*"
tasksolver = { path = "." }
# jiter (anthropic/openai's Rust JSON core): take the conda build, not the pypi wheel the SDKs
# would pull, so it matches the 3D-CoT consumer's conda jiter.
jiter = "*"
nodejs = ">=26,<27"
# NOTE: bun was removed — it pins icu 75, which conflicts with boost 1.91 (icu 78, pulled in
# for Boost.Thread); nodejs (what pymport uses) is icu-78 and coexists fine. Re-add bun in a
# separate environment if needed so its icu pin doesn't clash with the default env's boost.
# GNU make for node-gyp: pymport is compiled from source by node-gyp, which needs make (this host
# has no system make). The antigravity shim now builds with cmake+ninja (below), not make.
make = ">=4"
pkg-config = "*"           # node-gyp uses pkg-config to find python3-embed (pymport)
# Linux UAPI headers (linux/, asm/): glibc's <limits.h> needs <linux/limits.h>, but this
# WSLackware host has none in /usr/include (and NixOS has no /usr/include at all). The shim
# build points -idirafter at this package's sysroot in place — no copy — at
# $CONDA_PREFIX/x86_64-conda-linux-gnu/sysroot/usr/include.
kernel-headers_linux-64 = ">=6"   # -> sysroot 2.39 (matches 3D-CoT; relaxing binutils would otherwise drop it to 2.28/kh-4.18)
# Conda C/C++ compilers for the antigravity shim — the automatic build_py build AND manual
# `pixi run build-shim`. Use them instead of a bare PATH `gcc`/`g++`: on a Nix host those are
# Nix's, which bake /nix/store glibc rpaths into the shim and break its LD_PRELOAD. cmake picks
# them up via $CXX/$CC exported by the env. gxx pulls gcc; pinned >=13,<13.3 (gcc 13.2) — the
# newest gcc conda-forge ships a 13.x compiler wrapper for, and what the 3D-CoT consumer builds
# with, so both build the natives on the same toolchain (gcc 13.2 + binutils 2.40). Shared solve
# group with the local feature. All shim TUs are C++23 (Boost.Thread/Boost.Python).
gcc_linux-64 = ">=13,<13.3"
gxx_linux-64 = ">=13,<13.3"
# Boost.Thread for the pybridge worker (its thread::attributes sets the libpython worker's
# 16 MB stack — no std API can). libboost-devel = headers + link libs; it pulls libboost (the
# runtime libboost_thread.so, found at runtime via the shim's -rpath $CONDA_PREFIX/lib).
libboost-devel = ">=1.88"
# Boost.Python for the pybridge CPython embedding (bp::object/import/extract over the raw
# C-API). Python-version-specific: the py315 build matches the embedded libpython3.15.
libboost-python-devel = ">=1.88"
# libpython3.15.so for the natives that embed CPython (the wirecap bridge in vendor/agy, codex,
# the kimi addon). From Python 3.15 on conda-forge ships it in its own `libpython` package;
# `python` alone no longer provides it, so `pixi run build-shim` could not link -lpython3.15.
libpython = "*"
# antigravity HTTP/2 response decoding (h2reassemble.py) — from conda-forge, not pip.
hpack = ">=4"
brotli-python = ">=1.1"
gdb = ">=18.1,<19"
# binutils is NOT pinned: it comes from the gcc/gxx wrapper, which exact-pins the
# binutils_linux-64 build it was made against (gcc-13.2's wrapper -> binutils 2.40).
# Forcing binutils >=2.45 here would exclude gcc 13.2 and drop the toolchain to gcc 12.4.
gh = ">=2.96.0,<3"
glab = ">=1.106.0,<2"
paramiko = ">=5.0.0,<6"
# cmake + ninja build the antigravity shim (antigravity/CMakeLists.txt) — both the automatic
# build_py hook (during `pixi install`) and the manual `pixi run build-shim`.
cmake = ">=4.3.4,<5"
ninja = ">=1.11"
py-lief = ">=1.0.0,<2"
rust = ">=1.99.1,<2"
clang = ">=23.1.4,<24"
libclang = ">=23.1.4,<24"
libcap = ">=2.78,<3"
pygit2 = ">=1.19.3,<2"
htop = ">=3.5.1,<4"

# The antigravity shim build lives in antigravity/CMakeLists.txt (setup.py's build_py hook runs
# `cmake -S antigravity -B antigravity/build -G Ninja && cmake --build …` during the package build,
# so `pixi install` builds it). Manual rebuilds via the pixi tasks below:
#   pixi run build-shim         # configure (fetch deps) + compile the shim
#   pixi run shim-symbols       # ensure raw agy conversion + metadata are current, then rebuild
#   pixi run shim-agy-update    # query the latest release manifest + print new pin values
#   pixi run shim-hooks         # after editing procdef.h: regen pyagy's BOOKS mirror
[tool.pixi.package]
name = "tasksolver"
version = "0.0.1"

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"

# The natives (antigravity/vendor/agy + libagy.so, the codex binary, the kimi addon) are x86-64
# builds and a main target of this repo, so produce an arch-specific (linux-64) package, not noarch.
[tool.pixi.package.build.config]
noarch = false

# The python backend builds without build isolation, so the [build-system] requirements must be
# present in the package's host environment — plus `cmake`/`ninja` and `kernel-headers_linux-64`
# (UAPI headers), which setup.py's build_py hook needs to build the antigravity shim. build_py
# compiles against $CONDA_PREFIX's sysroot, so the headers must live in *this* (host) env, not
# just the default one.
[tool.pixi.package.host-dependencies]
python = "3.15.*"
pip = "*"
setuptools = ">=61"
cmake = ">=4.3.4,<5"          # drives the shim build (antigravity/CMakeLists.txt) in build_py
ninja = ">=1.11"             # cmake generator for the shim build
py-lief = ">=1.0.0,<2"   # make_libagy.py converts the upstream agy binary into libagy.so
kernel-headers_linux-64 = ">=6"   # -> sysroot 2.39 (matches 3D-CoT; relaxing binutils would otherwise drop it to 2.28/kh-4.18)
gcc_linux-64 = ">=13,<13.3"   # pulled by gxx; conda toolchain, not the Nix gcc on PATH
gxx_linux-64 = ">=13,<13.3"   # all shim TUs are C++23 (Boost.Thread/Boost.Python) → conda g++
libboost-devel = ">=1.88"     # Boost.Thread (headers + libboost_thread) for the pybridge worker
libboost-python-devel = ">=1.88"   # Boost.Python (embedding) — py315 build matches libpython3.15
libpython = "*"               # libpython3.15.so to link the embedded interpreter (split out of `python` in 3.15)
# codex build (build_py also compiles the vendored codex CLI, gnu-dynamic, linking the shared
# wirecap bridge + libpython): the Rust toolchain + aws-lc-rs/rustls' bindgen (clang/libclang) +
# openssl-sys + the linux-sandbox crate (libcap). Required — the build has no skip/opt-out.
rust = ">=1.99.1,<2"
clang = ">=23.1.4,<24"
libclang = ">=23.1.4,<24"
openssl = "*"
libcap = ">=2.78,<3"
# kimi build (build_py also bundles the vendored kimi-code CLI with tsdown and compiles the
# wirecap_node N-API addon): nodejs supplies node + npm/npx (pnpm rides `npx -y pnpm@<pin>`,
# honoring the vendored packageManager field — conda-forge carries no pnpm 10) and the N-API
# headers ($CONDA_PREFIX/include/node) the addon compiles against. The vendored monorepo's
# engine-strict floor is Node >=24.15.
nodejs = ">=26,<27"

# No [tool.pixi.activation.env]: nothing needs a global env var. The agy/codex embedded
# interpreters get PYTHONHOME per-child from their launchers (pyagy/pycodex `_env.py`), the codex
# binary self-resolves libpython/Boost via its $ORIGIN RUNPATH, and the shim via the loader's
# --library-path. The only env needs are the pymport dev-diagnostic tasks below, scoped to them.

[tool.pixi.tasks]
# node-gyp finds python3-embed via PKG_CONFIG_PATH when compiling pymport from source.
npm-install = { cmd = "npm_config_build_from_source=true CXXFLAGS='-std=c++17' npm install", env = { PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig" } }
# PYTHONHOME: the pymport-embedded interpreter needs it to find the conda stdlib.
pymport-test = { cmd = "node -e \"const {pymport,proxify}=require('pymport'); const sys=proxify(pymport('sys')); console.log('Python',sys.version.toString()); const np=proxify(pymport('numpy')); console.log('numpy',np.__version__.toString());\"", env = { PYTHONHOME = "$CONDA_PREFIX" }, depends-on = ["npm-install"] }

# `pixi install` is the canonical build — setup.py's build_py compiles the antigravity shim +
# wirecap_bridge AND the codex CLI (see [tool.pixi.package.host-dependencies]). The tasks below are
# NOT a second build path; they are shim iteration + agy-symbol maintenance that install doesn't do.
# (There is no build-codex task on purpose: codex is built only by pixi install — a separate
# default-env cargo build would thrash the install's host-env target/ fingerprints.)
# `build-shim` is a fast in-place shim rebuild for C++ iteration (skips the package rebuild); the
# cmake configure is idempotent (fetches vendored deps on first run), so each task re-runs it.
build-shim = "cmake -S antigravity -B antigravity/build -G Ninja && cmake --build antigravity/build"
shim-symbols = "cmake -S antigravity -B antigravity/build -G Ninja && cmake --build antigravity/build --target symbols && cmake --build antigravity/build"   # ensure library + metadata are current
shim-agy-update = "cmake -S antigravity -B antigravity/build -G Ninja && cmake --build antigravity/build --target agy-update"   # query latest manifest + print new pins
shim-hooks = { cmd = "python3 -m symbols.gen_sources --hooks", cwd = "antigravity" }   # regen pyagy's BOOKS mirror from procdef.h (after editing the C table)

# --- torch dev env (TaskSolver-local; consumers do NOT inherit any of this) ---
# The `local` and `app` features auto-map to the same-named
# [project.optional-dependencies] extras above. They are NOT merged into one environment:
# [tool.pixi.environments] below defines `default` (= app only, GPU-free) and `cuda`
# (= local + app). The PyTorch cu134 wheel index, the CUDA toolkit and the flash-attn
# build toolchain all live in the `local` feature; the CUDA 13.4 driver requirement is a
# virtual package on the workspace `platforms` above. Consumers never see any of it.
#
# flash-attn builds from source: no-build-isolation so it can import torch at build
# time. nvcc and the CUDA headers come from conda-forge (below), so the host needs
# only the NVIDIA driver, no CUDA toolkit; nvcc compiles host code with the conda
# gcc 13.2 (torch's cpp_extension passes `-ccbin $CC`).
[tool.pixi.feature.local.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu134"]
index-strategy = "unsafe-best-match"
no-build-isolation = ["flash-attn"]

# torch/torchvision/torchaudio come from the cu134 index explicitly: pypi.org's default torch 2.15
# wheels are CUDA 13.2 builds, and the shared solve group picks pypi.org's file over the extra index
# (the old lock did the same with cu130). The CUDA 13.4 builds match the conda toolkit flash-attn is
# compiled with, so the extension and torch's runtime libraries are one CUDA minor version.
[tool.pixi.feature.local.pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu134" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu134" }
torchaudio = { version = "*", index = "https://download.pytorch.org/whl/cu134" }

[tool.pixi.feature.local.dependencies]
cmake = ">=4"
ninja = "*"
gxx_linux-64 = ">=13,<13.3"
# CUDA toolkit for the flash-attn build, at the CUDA minor version of the torch wheels
# (cu134). nvcc plus the cudart/driver headers are all flash-attn's sources include:
# torch's CUDAContextLight.h would also need the cuBLAS/cuSPARSE/cuSOLVER headers, but
# flash-attn never includes it (checked with `g++ -M` against torch's headers).
cuda-version = "13.4.*"
cuda-nvcc = "*"
cuda-cudart-dev = "*"

[tool.pixi.feature.local.activation.env]
# conda-forge installs nvcc in $CONDA_PREFIX/bin but the CUDA headers only under
# targets/x86_64-linux/include, and the cuda-nvcc activation script sets neither
# variable: flash-attn runs $CUDA_HOME/bin/nvcc, and torch's cpp_extension adds
# CUDA_INC_PATH for the .cpp files g++ compiles. Both override a host CUDA_HOME
# (e.g. a Nix-store toolkit), so the build never mixes toolkits.
CUDA_HOME = "$CONDA_PREFIX"
CUDA_INC_PATH = "$CONDA_PREFIX/targets/x86_64-linux/include"
CC = "$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-gcc"
# flash-attn 2.8.3.post2 (newest on PyPI) compiles with -std=c++17, but torch >= 2.13's headers
# need C++20. tools/cxx20-g++ is the conda g++ with -std=c++17 rewritten to -std=c++20 (torch
# compiles .cpp files with $CXX), and NVCC_APPEND_FLAGS does the same for nvcc, whose last -std
# wins. Upstream main fixed setup.py alone; flash-attn from git cannot be locked here, because
# its setup.py imports torch at metadata time and PyPI torch is not installed during resolution.
# Remove both overrides (and tools/cxx20-g++) once a release after 2.8.3.post2 is on PyPI.
CXX = "$PIXI_PROJECT_ROOT/tools/cxx20-g++"
NVCC_APPEND_FLAGS = "-std=c++20"
# The cuda-nvcc activation puts `-ccbin=<g++>` here, and torch adds `-ccbin $CC` itself,
# so nvcc would warn "incompatible redefinition for option 'compiler-bindir'" per .cu file.
NVCC_PREPEND_FLAGS = ""
# NixOS keeps the driver's libcuda.so.1 in /run/opengl-driver/lib, on neither the loader
# path nor nix-ld's, so torch.cuda.is_available() was False. nix-ld adds this list to the
# library path of the conda/pip binaries it launches; other hosts ignore the variable.
NIX_LD_LIBRARY_PATH = "/run/opengl-driver/lib:${NIX_LD_LIBRARY_PATH:-/run/current-system/sw/share/nix-ld/lib}"
# flash-attn build tuning (its setup.py reads these exact names):
#  - FLASH_ATTN_CUDA_ARCHS: which SM archs to compile. "80" = Ampere (covers this
#    sm_86 RTX 3080) and avoids the default "80;90;100;120" fat binary (~4x work).
#    NOTE: flash-attn ignores TORCH_CUDA_ARCH_LIST entirely.
#  - MAX_JOBS: set explicitly so flash-attn skips its psutil auto-calc, which
#    under-counts jobs here because ZFS ARC deflates "available" memory. 8 jobs ×
#    ~3.7 GB (1 arch, NVCC_THREADS=1) ≈ 30 GB; ARC yields the rest.
#  - NVCC_THREADS: moot for a single arch (only parallelizes across archs).
FLASH_ATTN_CUDA_ARCHS = "80"
MAX_JOBS = "8"
NVCC_THREADS = "1"

# Two environments:
#   default — core + app (lightweight, no CUDA/torch dependency)
#   cuda    — core + local (torch cu134 + CUDA 13.4 toolkit + flash-attn) + app (UI)
# `pixi install` resolves the default env; use `pixi install -e cuda` (or
# `pixi run -e cuda …`) to get the full GPU stack. The CUDA 13.4 driver requirement
# (workspace platform virtual package) only matters for `cuda`. The PEP 621
# `local` / `app` extras stay separate, so consumers still install à la carte.
[tool.pixi.environments]
default = { features = ["app"], solve-group = "default" }
cuda = { features = ["local", "app"], solve-group = "default" }
